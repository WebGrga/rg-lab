[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20.19.0"

[[edge_functions]]
  function = "jev-board-auth"
  path = "/jev-board"

[[edge_functions]]
  function = "jev-board-auth"
  path = "/jev-board/*"

[[redirects]]
  from = "/btc-jev/api/*"
  to = "https://btc-jev-signal.roko-experiments.workers.dev/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/btc-jev"
  to = "https://rg-btc-jev.netlify.app/btc-jev"
  status = 200
  force = true

[[redirects]]
  from = "/btc-jev/*"
  to = "https://rg-btc-jev.netlify.app/btc-jev/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/jev-board/api/*"
  to = "https://jev-board-api.roko-experiments.workers.dev/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/jev-board/*"
  to = "https://rg-jev-board.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

